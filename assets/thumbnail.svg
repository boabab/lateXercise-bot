<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>lateXercise-bot</title>
  <desc>A Discord channel where a study group collaborates in per-exercise threads — members post solution photos and react, and the bot builds the LaTeX PDF.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a31"/>
      <stop offset="0.55" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#080d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5865F2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9fb3d9" opacity="0.05"/>
    </pattern>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="win"><rect x="64" y="116" width="1152" height="500" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="640" cy="360" rx="560" ry="360" fill="url(#glow)"/>

  <!-- title -->
  <text x="64" y="62" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="44">
    <tspan fill="#f1f5f9">late</tspan><tspan fill="#4cc2f5">X</tspan><tspan fill="#f1f5f9">ercise</tspan><tspan fill="#5d6b86" font-weight="700">-bot</tspan>
  </text>
  <text x="66" y="92" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#93a3bd">Your study group solves each exercise <tspan fill="#cdd6e6" font-weight="600">together in Discord threads</tspan> &#8212; the bot builds the LaTeX PDF</text>

  <!-- ===== Discord window ===== -->
  <rect x="64" y="116" width="1152" height="500" rx="16" fill="#313338" filter="url(#ds)"/>
  <g clip-path="url(#win)" font-family="'Helvetica Neue','Segoe UI',Arial,sans-serif">

    <!-- columns -->
    <rect x="64" y="116" width="220" height="500" fill="#2b2d31"/>
    <rect x="984" y="116" width="232" height="500" fill="#2b2d31"/>

    <!-- ============ SIDEBAR : threads ============ -->
    <text x="86" y="150" font-size="18" font-weight="800" fill="#f2f3f5">Sheet 06</text>
    <text x="250" y="150" font-size="14" fill="#949ba4">&#9662;</text>
    <line x1="64" y1="168" x2="284" y2="168" stroke="#232428" stroke-width="1"/>
    <text x="84" y="194" font-size="11" font-weight="700" fill="#80848e" letter-spacing="0.6">THREADS &#183; EXERCISES</text>

    <!-- active highlight (Exercise 2) -->
    <rect x="66" y="234" width="206" height="34" rx="6" fill="#3f4248"/>
    <rect x="66" y="241" width="4" height="20" rx="2" fill="#f2f3f5"/>

    <g font-size="15">
      <text x="82" y="221" font-family="'Apple Color Emoji'">&#129525;</text>
      <text x="108" y="221" fill="#8a8e95">Exercise 1</text>
      <text x="248" y="221" font-family="'Apple Color Emoji'" font-size="13">&#9989;</text>

      <text x="82" y="255" font-family="'Apple Color Emoji'">&#129525;</text>
      <text x="108" y="255" fill="#f2f3f5" font-weight="600">Exercise 2</text>

      <text x="82" y="289" font-family="'Apple Color Emoji'">&#129525;</text>
      <text x="108" y="289" fill="#8a8e95">Exercise 3</text>

      <text x="82" y="323" font-family="'Apple Color Emoji'">&#129525;</text>
      <text x="108" y="323" fill="#8a8e95">Exercise 4</text>

      <text x="82" y="357" font-family="'Apple Color Emoji'">&#129525;</text>
      <text x="108" y="357" fill="#8a8e95">Exercise 5</text>
    </g>
    <text x="84" y="402" font-size="12" fill="#6d7178">+  one thread per exercise</text>

    <!-- user footer -->
    <rect x="64" y="560" width="220" height="56" fill="#232428"/>
    <circle cx="96" cy="588" r="16" fill="#3ba55d"/>
    <text x="96" y="593" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Y</text>
    <circle cx="107" cy="599" r="5" fill="#23a55a" stroke="#232428" stroke-width="2.5"/>
    <text x="122" y="585" font-size="13" font-weight="600" fill="#f2f3f5">you</text>
    <text x="122" y="600" font-size="11" fill="#949ba4">#1234</text>

    <!-- ============ HEADER strip ============ -->
    <text x="300" y="150" font-size="18" font-family="'Apple Color Emoji'">&#129525;</text>
    <text x="328" y="150" font-size="18" font-weight="800" fill="#f2f3f5">Exercise 2</text>
    <line x1="452" y1="134" x2="452" y2="152" stroke="#3f4248" stroke-width="1.5"/>
    <text x="468" y="150" font-size="14" fill="#949ba4">4 members solving together</text>
    <!-- live pill -->
    <rect x="868" y="132" width="84" height="22" rx="11" fill="#1e3a2a"/>
    <circle cx="884" cy="143" r="4" fill="#23a55a"/>
    <text x="896" y="147" font-size="12" font-weight="700" fill="#43d17f">live</text>
    <text x="1006" y="150" font-size="12" font-weight="700" fill="#80848e" letter-spacing="0.5">MEMBERS</text>
    <line x1="284" y1="168" x2="1216" y2="168" stroke="#232428" stroke-width="1"/>

    <!-- ============ MAIN : conversation ============ -->
    <!-- Mara -->
    <circle cx="312" cy="200" r="16" fill="#EB459E"/><text x="312" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">M</text>
    <text x="340" y="196" font-size="14" font-weight="700" fill="#f0a6cf">Mara</text>
    <text x="386" y="196" font-size="11" fill="#80848e">14:01</text>
    <text x="340" y="215" font-size="14" fill="#dbdee1">drop your solutions here <tspan font-family="'Apple Color Emoji'">&#128071;</tspan></text>

    <!-- Jonas -->
    <circle cx="312" cy="244" r="16" fill="#3E82F0"/><text x="312" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">J</text>
    <text x="340" y="240" font-size="14" font-weight="700" fill="#9ec1f7">Jonas</text>
    <text x="390" y="240" font-size="11" fill="#80848e">14:03</text>
    <text x="340" y="259" font-size="14" fill="#dbdee1">on it &#8212; (a) and (b) coming <tspan font-family="'Apple Color Emoji'">&#128247;</tspan></text>

    <!-- gallery -->
    <text x="312" y="298" font-size="13" font-weight="600" fill="#b5bac1"><tspan font-family="'Apple Color Emoji'">&#128206;</tspan>  Solution photos <tspan fill="#80848e" font-weight="400">&#183; 4 parts contributed</tspan></text>
    <g>
      <g transform="translate(312,310)">
        <rect width="108" height="84" rx="8" fill="#f0eadd"/>
        <text x="10" y="22" font-size="12" font-weight="700" fill="#3f5230">(a)</text>
        <text x="10" y="46" font-size="13" font-style="italic" font-family="Georgia,serif" fill="#6f6757">f&#8242;(x)=2x</text>
        <text x="10" y="64" font-size="13" font-style="italic" font-family="Georgia,serif" fill="#6f6757">&#8722; 3</text>
        <circle cx="92" cy="68" r="12" fill="#EB459E" stroke="#f0eadd" stroke-width="2"/><text x="92" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">M</text>
      </g>
      <g transform="translate(432,310)">
        <rect width="108" height="84" rx="8" fill="#efe9da"/>
        <text x="10" y="22" font-size="12" font-weight="700" fill="#3f5230">(b)</text>
        <text x="10" y="48" font-size="14" font-style="italic" font-family="Georgia,serif" fill="#6f6757">&#8747;&#8320;&#185; x&#178; dx</text>
        <text x="10" y="66" font-size="13" font-style="italic" font-family="Georgia,serif" fill="#6f6757">= 1/3</text>
        <circle cx="92" cy="68" r="12" fill="#3E82F0" stroke="#efe9da" stroke-width="2"/><text x="92" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">J</text>
      </g>
      <g transform="translate(552,310)">
        <rect width="108" height="84" rx="8" fill="#f1ebde"/>
        <text x="10" y="22" font-size="12" font-weight="700" fill="#3f5230">(c)</text>
        <text x="10" y="48" font-size="13" font-style="italic" font-family="Georgia,serif" fill="#6f6757">a&#178;+b&#178;</text>
        <text x="10" y="66" font-size="13" font-style="italic" font-family="Georgia,serif" fill="#6f6757">= c&#178;</text>
        <circle cx="92" cy="68" r="12" fill="#F0B232" stroke="#f1ebde" stroke-width="2"/><text x="92" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">L</text>
      </g>
      <g transform="translate(672,310)">
        <rect width="108" height="84" rx="8" fill="#efe9da"/>
        <text x="10" y="22" font-size="12" font-weight="700" fill="#3f5230">(d)</text>
        <text x="10" y="48" font-size="13" font-style="italic" font-family="Georgia,serif" fill="#6f6757">&#8721; 1/n&#178;</text>
        <text x="10" y="66" font-size="13" font-style="italic" font-family="Georgia,serif" fill="#6f6757">= &#960;&#178;/6</text>
        <circle cx="92" cy="68" r="12" fill="#ED4245" stroke="#efe9da" stroke-width="2"/><text x="92" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">T</text>
      </g>
    </g>
    <!-- reactions on the gallery -->
    <g font-size="12" font-weight="600">
      <rect x="312" y="406" width="54" height="24" rx="12" fill="#3b3d6b"/><text x="324" y="422" font-family="'Apple Color Emoji'">&#128077;</text><text x="345" y="422" fill="#c5cbf5">6</text>
      <rect x="374" y="406" width="54" height="24" rx="12" fill="#2b2d31"/><text x="386" y="422" font-family="'Apple Color Emoji'">&#9989;</text><text x="407" y="422" fill="#b5bac1">4</text>
      <rect x="436" y="406" width="54" height="24" rx="12" fill="#2b2d31"/><text x="448" y="422" font-family="'Apple Color Emoji'">&#128293;</text><text x="469" y="422" fill="#b5bac1">3</text>
    </g>

    <!-- bot message -->
    <circle cx="312" cy="466" r="18" fill="#5865F2"/><text x="312" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Georgia,serif">&#955;</text>
    <text x="340" y="461" font-size="14" font-weight="700" fill="#c2c8ff">lateXercise-bot</text>
    <rect x="456" y="450" width="34" height="16" rx="4" fill="#5865F2"/><text x="473" y="462" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">BOT</text>
    <text x="500" y="461" font-size="11" fill="#80848e">14:09</text>
    <text x="340" y="481" font-size="14" fill="#dbdee1"><tspan font-family="'SF Mono',Menlo,monospace" fill="#a9b1ff">/build</tspan> &#10003; &#8212; ready to submit:</text>
    <!-- PDF attachment chip -->
    <rect x="340" y="490" width="300" height="58" rx="8" fill="#ffffff"/>
    <rect x="354" y="502" width="34" height="34" rx="5" fill="#e23b53"/><text x="371" y="524" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">PDF</text>
    <text x="400" y="516" font-size="14" font-weight="700" fill="#1f2430">Group_000_Sheet_06.pdf</text>
    <text x="400" y="534" font-size="11" fill="#6b7280">312 KB &#183; built with pdflatex</text>

    <!-- typing indicator -->
    <circle cx="320" cy="576" r="3" fill="#b5bac1"/><circle cx="331" cy="576" r="3" fill="#b5bac1"/><circle cx="342" cy="576" r="3" fill="#b5bac1"/>
    <text x="356" y="581" font-size="13" font-style="italic" fill="#b5bac1">Tom is typing &#8230;</text>

    <!-- ============ MEMBER rail ============ -->
    <text x="1004" y="196" font-size="11" font-weight="700" fill="#80848e" letter-spacing="0.5">ONLINE &#8212; 5</text>
    <g font-size="14" font-weight="600">
      <circle cx="1020" cy="222" r="14" fill="#EB459E"/><text x="1020" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">M</text><circle cx="1030" cy="231" r="4.5" fill="#23a55a" stroke="#2b2d31" stroke-width="2.5"/><text x="1044" y="227" fill="#e9eaed">Mara</text>
      <circle cx="1020" cy="262" r="14" fill="#3E82F0"/><text x="1020" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">J</text><circle cx="1030" cy="271" r="4.5" fill="#23a55a" stroke="#2b2d31" stroke-width="2.5"/><text x="1044" y="267" fill="#e9eaed">Jonas</text>
      <circle cx="1020" cy="302" r="14" fill="#F0B232"/><text x="1020" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">L</text><circle cx="1030" cy="311" r="4.5" fill="#23a55a" stroke="#2b2d31" stroke-width="2.5"/><text x="1044" y="307" fill="#e9eaed">Lina</text>
      <circle cx="1020" cy="342" r="14" fill="#ED4245"/><text x="1020" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">T</text><circle cx="1030" cy="351" r="4.5" fill="#23a55a" stroke="#2b2d31" stroke-width="2.5"/><text x="1044" y="347" fill="#e9eaed">Tom</text>
      <circle cx="1020" cy="382" r="14" fill="#5865F2"/><text x="1020" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Georgia,serif">&#955;</text><circle cx="1030" cy="391" r="4.5" fill="#23a55a" stroke="#2b2d31" stroke-width="2.5"/><text x="1044" y="387" fill="#c2c8ff">lateXercise-bot</text>
      <rect x="1162" y="376" width="32" height="15" rx="4" fill="#5865F2"/><text x="1178" y="387" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">BOT</text>
    </g>
  </g>
</svg>
